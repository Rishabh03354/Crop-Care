# ---------------------------------------------------------------------------
# Alembic configuration for Crop Care Crop.
#
# `sqlalchemy.url` is intentionally LEFT EMPTY. The URL is injected at runtime
# by `alembic/env.py` from (in order of precedence):
#   1. `-x db_url=...` on the command line
#   2. `config.set_main_option("sqlalchemy.url", ...)` (used by tests)
#   3. DATABASE_URL from the environment / .env
# ---------------------------------------------------------------------------

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
